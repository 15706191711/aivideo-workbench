<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>项目工作台</title>
<style>
  :root {
    --bg: #fafafa;
    --bg2: #f0f2f5;
    --line: #e0e0e0;
    --gold: #2c5f8a;
    --gold-dim: #5a8ab0;
    --cinnabar: #c0392b;
    --text: #2c2c2c;
    --text-dim: #888;
  }
  [data-theme="dark"] {
    --bg: #0f1115;
    --bg2: #1a1d24;
    --line: #2a2e38;
    --gold: #5a9fd4;
    --gold-dim: #3a7ab0;
    --cinnabar: #e06050;
    --text: #d8d8d8;
    --text-dim: #7a7a7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Songti SC","SimSun",serif; background: var(--bg); color: var(--text); line-height: 1.7; display: flex; min-height: 100vh; }
  .sidebar { width: 200px; background: var(--bg2); border-right: 1px solid var(--line); padding: 28px 0; position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; }
  .logo { padding: 0 24px 24px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .logo h1 { font-size: 20px; color: var(--gold); letter-spacing: 4px; font-weight: normal; }
  .logo p { font-size: 11px; color: var(--text-dim); margin-top: 6px; }
  .theme-btn { margin: 12px 24px 0; padding: 6px 12px; background: none; border: 1px solid var(--line); color: var(--text-dim); cursor: pointer; font-family: inherit; font-size: 12px; width: calc(100% - 48px); }
  .ver-label, .nav-label { font-size: 11px; color: var(--text-dim); padding: 8px 12px; letter-spacing: 2px; }
  .ver-btn, .nav-btn { display: block; width: 100%; text-align: left; padding: 10px 12px; background: none; border: none; color: var(--text); cursor: pointer; font-family: inherit; font-size: 14px; border-left: 2px solid transparent; }
  .ver-btn small { display: block; color: var(--text-dim); font-size: 11px; }
  .ver-btn.active, .nav-btn.active { border-left-color: var(--gold); color: var(--gold); background: rgba(90,159,212,.06); }
  .main { margin-left: 200px; flex: 1; padding: 40px 48px; max-width: 1200px; }
  .main-head { border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 32px; }
  .main-head h2 { font-size: 28px; color: var(--gold); font-weight: normal; margin-top: 8px; }
  .main-head .meta { font-size: 13px; color: var(--text-dim); margin-top: 8px; }
  .stages { display: flex; align-items: center; gap: 0; margin-bottom: 36px; }
  .stage { display: flex; align-items: center; gap: 8px; }
  .stage .dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-family: sans-serif; }
  .stage.done .dot { background: var(--gold); color: var(--bg); }
  .stage.doing .dot { background: transparent; border: 2px solid var(--gold); color: var(--gold); animation: pulse 1.5s infinite; }
  .stage.todo .dot { background: var(--bg2); color: var(--text-dim); border: 1px solid var(--line); }
  .stage-sep { width: 32px; height: 1px; background: var(--line); margin: 0 8px; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(90,159,212,.4)} 50%{box-shadow:0 0 0 6px rgba(90,159,212,0)} }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
  .block { border: 1px solid var(--line); padding: 24px; }
  .block h3 { font-size: 14px; color: var(--gold); letter-spacing: 2px; margin-bottom: 14px; font-weight: normal; }
  .block p { font-size: 14px; line-height: 1.9; }
  .tag { display: inline-block; padding: 3px 10px; border: 1px solid var(--gold-dim); color: var(--gold); font-size: 12px; margin: 0 6px 6px 0; }
  .asset-cat { margin-bottom: 36px; }
  .asset-cat h3 { font-size: 15px; color: var(--gold); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .asset { border: 1px solid var(--line); background: var(--bg2); cursor: zoom-in; }
  .asset:hover { border-color: var(--gold); }
  .asset img { width: 100%; height: 180px; object-fit: cover; display: block; }
  .asset .cap { padding: 10px 12px; font-size: 12px; color: var(--text-dim); border-top: 1px solid var(--line); }
  table.shots { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.shots th { text-align: left; padding: 12px 10px; border-bottom: 2px solid var(--gold-dim); color: var(--gold); font-weight: normal; font-size: 12px; }
  table.shots td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.shot-no { color: var(--gold); font-weight: bold; width: 40px; }
  td.shot-line { color: var(--gold); }
  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
  .thumbs img { width: 56px; height: 56px; object-fit: cover; border: 1px solid var(--line); cursor: zoom-in; }
  .lb { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.95); z-index: 999; justify-content: center; align-items: center; cursor: zoom-out; }
  .lb img { max-width: 90%; max-height: 90%; }
  @media (max-width: 900px) { .sidebar { width: 60px; } .main { margin-left: 60px; padding: 24px 16px; } .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo"><h1>项目名</h1><p>AIGC 创作工作台</p></div>
  <button class="theme-btn" onclick="toggleTheme()">切换暗色</button>
  <div class="ver-label">版本</div>
  <button class="ver-btn active">V1 版本名<small>副标题</small></button>
  <div class="nav-label">阶段</div>
  <button class="nav-btn active">概览</button>
  <button class="nav-btn">剧本</button>
  <button class="nav-btn">资产库</button>
  <button class="nav-btn">分镜表</button>
</aside>
<main class="main">
  <div class="main-head"><h2>项目标题</h2><div class="meta">技术规格</div></div>
  <div class="stages"></div>
  <div id="content"></div>
</main>
<div class="lb" onclick="this.style.display='none'"><img id="lbImg"></div>
<script>
function toggleTheme(){const h=document.documentElement;const d=h.getAttribute('data-theme')==='dark';if(d){h.removeAttribute('data-theme')}else{h.setAttribute('data-theme','dark')}}
</script>
</body>
</html>
